version: '3.8'

services:
  web:
    build: .
    container_name: voice-service-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Maps your local 'app' folder to the container's 'app' folder
      # This enables Hot Reloading (updates code instantly)
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload